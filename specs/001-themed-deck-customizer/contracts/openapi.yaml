openapi: 3.0.3
info:
  title: Themed Deck Customizer API
  version: 1.0.0

paths:
  /decks:
    post:
      summary: Create a themed deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeckRequest'
      responses:
        '201':
          description: Deck created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /decks/{deckId}:
    get:
      summary: Get a public deck by ID or share slug
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deck details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CreateDeckRequest:
      type: object
      required: [deck_list_text, theme_description, commander_name]
      properties:
        deck_list_text:
          type: string
          description: Raw deck list input (quantity + card name per line).
        theme_description:
          type: string
        commander_name:
          type: string
        title:
          type: string
    DeckResponse:
      type: object
      properties:
        id:
          type: string
        share_url:
          type: string
        status:
          type: string
          enum: [complete, partial, failed]
        commander_name:
          type: string
        theme_description:
          type: string
        cards:
          type: array
          items:
            $ref: '#/components/schemas/DeckCard'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/DeckError'
    DeckCard:
      type: object
      properties:
        original_name:
          type: string
        quantity:
          type: integer
        card_type:
          type: string
        themed_name:
          type: string
        art_description:
          type: string
        image_url:
          type: string
          nullable: true
    DeckError:
      type: object
      properties:
        line_number:
          type: integer
        line_text:
          type: string
        error_code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
